name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    # GitHub-hosted, not the self-hosted quantus-builders runner: on qcluster the
    # dind build saturated the node NVMe that holds Longhorn replicas and etcd
    # (talos-cluster OPERATIONS.md, 2026-11-02/03 entry). Public repo, so free.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          # - recipe.yml
          # - recipe-nvidia.yml
          - work-recipe.yml
    steps:
      # The self-hosted quantus-builders runner (minimal actions-runner image)
      # lacks `envsubst`. sigstore/cosign-installer started requiring it on
      # 2026-07-07 (SHA 6f9f177), which broke the nested cosign step in
      # blue-build/github-action@v1 with "envsubst: command not found" (exit 127).
      # See overlord/missions/bluebuild-upgrade/findings.md.
      # On ubuntu-latest envsubst is preinstalled, so this step is a no-op; remove it later.
      - name: Ensure envsubst is available (gettext-base)
        run: |
          if command -v envsubst >/dev/null 2>&1; then
            echo "envsubst already present; nothing to do"
          elif [ "$(id -u)" -eq 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends gettext-base
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext-base
          fi

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
